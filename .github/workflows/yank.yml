name: yank

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to yank (or un-yank) on crates.io"
        required: true
      undo:
        description: "Undo an earlier yank"
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write

jobs:
  yank:
    runs-on: ubuntu-latest
    environment: release

    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88.0
      - uses: rust-lang/crates-io-auth-action@v1
        id: auth

      # Yanking keeps the version installable by exact pin but makes
      # `cargo install keycloak-cli` (and every `^` requirement) skip it.
      - name: Yank from crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo yank --version "${{ inputs.version }}" ${{ inputs.undo && '--undo' || '' }}
