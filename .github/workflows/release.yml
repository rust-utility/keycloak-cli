name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build release binaries for"
        required: true

# Only the Linux binaries are built here: GitHub never assigned runners to the
# macOS jobs for this organisation (they are cancelled at creation without a
# runner), so the Apple binaries and the SHA256SUMS covering every asset are
# produced by `scripts/release-macos.sh` on a Mac. See doc/PUBLISHING.md.

permissions:
  contents: write

jobs:
  binaries:
    name: binary ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
          - target: aarch64-unknown-linux-musl
            os: ubuntu-24.04-arm
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2

      # The musl targets are static: they run on any distribution.
      - name: Install musl tools
        if: contains(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Build
        env:
          # The repository pins `channel = "1.88"` in rust-toolchain.toml, which
          # rustup treats as a different toolchain from the `1.88.0` the action
          # installs; without this the musl std targets added above are invisible.
          RUSTUP_TOOLCHAIN: 1.88.0
          # musl targets need the musl linker wrapper for the same architecture.
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package the binary
        run: |
          cp "target/${{ matrix.target }}/release/keycloak-cli" "keycloak-cli-${{ matrix.target }}"
          chmod +x "keycloak-cli-${{ matrix.target }}"

      - name: Attach it to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ github.event.inputs.tag || github.ref_name }}"
          if ! gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$tag" --repo "$GITHUB_REPOSITORY" \
              --title "keycloak-cli ${tag#v}" --notes "Release ${tag#v}. See the notes on the repository."
          fi
          gh release upload "$tag" "keycloak-cli-${{ matrix.target }}" \
            --clobber --repo "$GITHUB_REPOSITORY"
