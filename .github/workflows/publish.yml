name: publish

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Package and verify without uploading"
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write # required for the crates.io OIDC token exchange

# Publishing stays inert until a trusted publisher exists on crates.io.
# Set the repository variable CRATES_IO_PUBLISH=true after configuring it
# (see doc/PUBLISHING.md); until then a tag only runs ci.yml.
jobs:
  publish:
    runs-on: ubuntu-latest
    if: vars.CRATES_IO_PUBLISH == 'true'
    environment: release

    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88.0
      - uses: Swatinem/rust-cache@v2

      - name: Test
        run: cargo test --all --locked

      - uses: rust-lang/crates-io-auth-action@v1
        id: auth

      - name: Publish keycloak-cli
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo publish --locked ${{ inputs.dry_run && '--dry-run' || '' }}
