name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Test
        run: cargo test --all

      # The generated sources must come from the published crate, not from a
      # checkout: this downloads the pinned keycloak release, unpacks it and runs
      # its own generator, then fails on any byte of difference.
      # `keycloak` disables reqwest's default features, which drops TLS; without
      # this the CLI cannot reach an https:// server or the update API.
      - name: TLS backend is linked
        run: cargo tree -e features -i reqwest | grep -q 'reqwest feature "rustls"'

      - name: Generated sources are up to date
        run: scripts/generate.sh --check

      # A tag-limited build must compile and ship only that tag's commands (M2).
      - name: One tag builds and lists only its commands
        run: |
          cargo build --no-default-features --features tag-users
          help=$(./target/debug/keycloak-cli --help)
          case $help in
            *users*) ;;
            *) echo "the users group is missing from --help"; exit 1 ;;
          esac
          case $help in
            *clients*) echo "clients must not be in a tag-users build"; exit 1 ;;
          esac

      - name: Build release
        run: cargo build --release

      # Catches files the crate needs at publish time (README, licenses) that were
      # not committed, and metadata the registry rejects.
      - name: Package
        run: cargo package --locked
