[package]
name = "keycloak-cli"
version = "26.8.100"
authors = ["Alexander Korolev <alexander.korolev.germany@gmail.com>"]
edition = "2021"
rust-version = "1.88"
# `keycloak-cli-generate` is internal (see scripts/generate.sh).
default-run = "keycloak-cli"
categories = ["command-line-utilities"]
description = "Command-line interface for the Keycloak Admin REST API"
documentation = "https://docs.rs/keycloak-cli"
homepage = "https://github.com/rust-utility/keycloak-cli"
keywords = ["keycloak", "cli", "admin-api", "rest", "iam"]
license = "Unlicense OR MIT"
readme = "README.md"
repository = "https://github.com/rust-utility/keycloak-cli"
# The pinned toolchain is for development here; it must not constrain consumers.
exclude = ["rust-toolchain.toml"]

[features]
# One feature per tag of the keycloak crate; the list is the one the crate
# itself prints (`tags cargo`, see src/generated/tags.rs), and every feature
# enables the matching feature of the crate so its module compiles.
default = ["tags-all"]
tags-all = ["tag-attack-detection", "tag-authentication-management", "tag-client-attribute-certificate", "tag-client-initial-access", "tag-client-registration-policy", "tag-client-role-mappings", "tag-client-scopes", "tag-clients", "tag-component", "tag-groups", "tag-identity-providers", "tag-key", "tag-organizations", "tag-protocol-mappers", "tag-realms-admin", "tag-role-mapper", "tag-roles", "tag-roles-by-id", "tag-scope-mappings", "tag-users", "tag-workflows", "tag-none"]
tag-attack-detection = ["keycloak/tag-attack-detection"]
tag-authentication-management = ["keycloak/tag-authentication-management"]
tag-client-attribute-certificate = ["keycloak/tag-client-attribute-certificate"]
tag-client-initial-access = ["keycloak/tag-client-initial-access"]
tag-client-registration-policy = ["keycloak/tag-client-registration-policy"]
tag-client-role-mappings = ["keycloak/tag-client-role-mappings"]
tag-client-scopes = ["keycloak/tag-client-scopes"]
tag-clients = ["keycloak/tag-clients"]
tag-component = ["keycloak/tag-component"]
tag-groups = ["keycloak/tag-groups"]
tag-identity-providers = ["keycloak/tag-identity-providers"]
tag-key = ["keycloak/tag-key"]
tag-organizations = ["keycloak/tag-organizations"]
tag-protocol-mappers = ["keycloak/tag-protocol-mappers"]
tag-realms-admin = ["keycloak/tag-realms-admin"]
tag-role-mapper = ["keycloak/tag-role-mapper"]
tag-roles = ["keycloak/tag-roles"]
tag-roles-by-id = ["keycloak/tag-roles-by-id"]
tag-scope-mappings = ["keycloak/tag-scope-mappings"]
tag-users = ["keycloak/tag-users"]
tag-workflows = ["keycloak/tag-workflows"]
tag-none = ["keycloak/tag-none"]

[dependencies]
clap = { version = "4", features = ["cargo", "derive", "env"] }
heck = "0.5"
# Pinned to the exact crate release the generated sources come from; the version
# scheme of this package follows it (see doc/ROADMAP.md).
keycloak = { version = "=26.8.100", default-features = false, features = ["reqwest"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# A current-thread runtime is all the CLI needs: one request per invocation.
tokio = { version = "1", features = ["rt", "net", "time"] }
